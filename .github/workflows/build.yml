# 构建并测试 dc 运行器。
#
# 在梦里，这个 workflow 每次都是绿的。醒来后请看 Actions 页面确认。

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 v0.2.0）。只有填写后才会创建 Release。'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            build_type: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }} --prefix dist

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          exe=$(ls dist/bin/dc* | head -n 1)
          echo "using $exe"

          "$exe" version
          "$exe" help >/dev/null
          "$exe" sleep 8
          "$exe" run src/main.dc
          "$exe" wake

          # 睡眠不足七小时必须失败
          if "$exe" sleep 4 2>/dev/null; then
            echo "expected 'sleep 4' to fail"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dc-${{ matrix.os }}-${{ matrix.build_type }}
          path: dist/
          if-no-files-found: error

  release:
    name: release
    # 推送 v* 标签时自动发布；手动触发时，填写 version 才发布。
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          cd artifacts
          for d in dc-*; do
            tar -czf "$d.tar.gz" -C "$d" .
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个任务没有 checkout，gh 无法从 .git 推断仓库，需要显式指定。
          GH_REPO: ${{ github.repository }}
          # 标签推送时用标签名；手动触发时用输入的版本号。
          # --target 只在标签不存在时生效，由 Actions 直接创建标签。
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
        run: |
          gh release create "$TAG" artifacts/*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "dc $TAG" \
            --generate-notes
